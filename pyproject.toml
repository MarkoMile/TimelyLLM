[project]
name = "timelyllm"
version = "0.1.0"
description = "TimelyLLM: Real-time LLM inference scheduling"
# 3.12 is what vLLM 0.27.x and the aarch64 torch build target. Upstream pinned
# >=3.10,<3.11 for vLLM 0.5.4.
requires-python = ">=3.12"
dependencies = [
    # Serving engine. vLLM pins torch, transformers, tokenizers, safetensors,
    # ray, fastapi and friends itself, so they are deliberately not repeated
    # here -- pinning vLLM's transitive dependencies alongside it is what made
    # the upstream dependency set unresolvable once vLLM moved on. Pinned
    # exactly because the V1 backend mirrors an internal detokenizer factory;
    # see PORT_PLAN.md B1.
    "vllm==0.27.1",
    # Scientific computing and vision
    "numpy",
    "matplotlib",
    "opencv-python",
    "pillow",
    "filterpy",
    # Utilities
    "psutil",
    "overrides",
    "openai",
    "soundfile>=0.12.1",
]

[project.optional-dependencies]
speech = [
    "piper-tts",
    "onnxruntime",
    "openai-whisper",
    "soundfile",
]
# robot dependencies (install manually):
#   podtp: pip install -e /path/to/POD-XIAO-Python
#   djitellopy: pip install djitellopy
#   ROS 2 (rclpy, geometry_msgs, nav_msgs, sensor_msgs) via the system install
notebook = [
    "jupyter",
    "ipykernel",
]

[tool.uv]
environments = [
    "sys_platform == 'linux'",
]

[tool.hatch.build.targets.wheel]
packages = ["timelyllm"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
